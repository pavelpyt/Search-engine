# Research Agents behind nginx; the app runs on 127.0.0.1:8090. deploy/deploy.sh installs this file.
server {
    listen 80;
    listen [::]:80;
    server_name demo.pavelpytlik.cz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
# --- https ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.pavelpytlik.cz;
    ssl_certificate     /etc/letsencrypt/live/demo.pavelpytlik.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.pavelpytlik.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;        # SSE events must reach the browser immediately
        proxy_read_timeout 900s;    # a complex run streams for minutes
    }
}
